x-api: &api
  build: .
  environment: &environment
    REDIS_URL: redis://redis:6379
  stop_grace_period: 12s

services:
  redis:
    image: redis:7.4-alpine
    ports:
      - '127.0.0.1:6379:6379'
  api-1:
    <<: *api
    environment:
      <<: *environment
      INSTANCE_ID: api-1
    ports:
      - '127.0.0.1:3001:3000'
  api-2:
    <<: *api
    environment:
      <<: *environment
      INSTANCE_ID: api-2
    ports:
      - '127.0.0.1:3002:3000'
  api-3:
    <<: *api
    environment:
      <<: *environment
      INSTANCE_ID: api-3
    ports:
      - '127.0.0.1:3003:3000'
  nginx:
    image: nginx:1.28-alpine
    ports:
      - '127.0.0.1:8080:80'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-1
      - api-2
      - api-3
