events {}
http {
    upstream api {
        server api-1:3000;
        server api-2:3000;
        server api-3:3000;
    }
    server {
        listen 80;
        default_type application/json;
        location / {
            # Nginx joins duplicate fields with commas; reject them before forwarding.
            if ($http_x_api_key ~ ",") {
                return 400 '{"error":{"code":"INVALID_API_KEY"}}';
            }
            proxy_pass http://api;
        }
    }
}
